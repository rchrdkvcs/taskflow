# Pod PostgreSQL, transposition provisoire du service db de compose.yaml.
# Pas de volume : les données vivent dans le système de fichiers du conteneur
# et disparaissent avec le Pod. Le mot de passe est un mot de passe de test,
# en clair, en attendant l'externalisation (séance 6).
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: taskflow
  labels:
    app: taskflow
    component: db
spec:
  restartPolicy: Always
  containers:
    - name: postgres
      image: docker.io/postgres:18-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - name: postgres
          containerPort: 5432
      env:
        - name: POSTGRES_DB
          value: taskflow
        - name: POSTGRES_USER
          value: taskflow
        # Pas d'équivalent du fichier .env à ce stade : le mot de passe
        # de l'image postgres est renseigné ici, à titre provisoire.
        - name: POSTGRES_PASSWORD
          value: taskflow-test
